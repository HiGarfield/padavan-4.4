name: build

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on: 
#  push:
#    branches:
#    - "*"
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Please select the model to compile'
        options:
        - 'All'
        - 'A3004NS-dual'
        - 'B70'
        - 'BELL-A040WQ'
        - 'CR660x'
        - 'DIR-878'
        - 'DIR-882'
        - 'EA7500'
        - 'ZTE-E8820V2'
        - 'GHL'
        - 'JCG-836PRO'
        - 'JCG-AC860M'
        - 'JCG-Q20-PB'
        - 'JCG-Q20'
        - 'JCG-Y2'
        - 'K2P-USB'
        - 'K2P-NANO'
        - 'K2P'
        - 'MI-4'
        - 'MI-R3G'
        - 'MI-R3P-PB'
        - 'MI-R3P-SPI'
        - 'MI-R3P'
        - 'MI-R4A'
        - 'MR2600'
        - 'MSG1500'
        - 'MSG1500-Z'
        - 'NETGEAR-BZV'
        - 'NEWIFI'
        - 'NEWIFI3'
        - 'QM-B1'
        - 'R2100'
        - 'NETGEAR-R6800'
        - 'JDCLOUD-RE-CP-02'
        - 'RM2100'
        - 'RT-AC85P'
        - 'TX1801'
        - 'WR1200JS'
        - 'XY-C1'
        - 'ZTE-E8820S'
        - 'WE410443-TC'
        default: 'K2P'
      release:
        type: boolean
        description: 'upload to release'
        default: 'true'
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.target }}" = "All" ]; then
            echo 'matrix=["A3004NS-dual","B70","BELL-A040WQ","CR660x","DIR-878","DIR-882","EA7500","ZTE-E8820V2","GHL","JCG-836PRO","JCG-AC860M","JCG-Q20-PB","JCG-Q20","JCG-Y2","K2P-USB","K2P-NANO","K2P","MI-4","MI-R3G","MI-R3P-PB","MI-R3P-SPI","MI-R3P","MI-R4A","MR2600","MSG1500","MSG1500-Z","NETGEAR-BZV","NEWIFI","NEWIFI3","QM-B1","R2100","NETGEAR-R6800","JDCLOUD-RE-CP-02","RM2100","RT-AC85P","TX1801","WR1200JS","XY-C1","ZTE-E8820S","WE410443-TC"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ inputs.target }}"]' >> $GITHUB_OUTPUT
          fi
  build:
    needs: setup
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.19.2'
          # Disable setup-go cache to avoid frequent cache API restore/save errors in this workflow.
          cache: false
      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin libltdl-dev gperf python3-docutils autopoint gettext ccache
      - name: Start Build
        run: |
          make ${{ matrix.target }}
          echo "TAG_NAME=$(date +%Y%m%d)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ env.TAG_NAME }}
          path: trunk/images/*.trx
          if-no-files-found: error
  release:
    needs: build
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify firmware artifacts
        run: |
          find artifacts -type f -name "*.trx" | tee /tmp/firmware-artifacts.txt
          test -s /tmp/firmware-artifacts.txt
      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          while IFS= read -r fw; do
            cp "$fw" release-artifacts/
          done < /tmp/firmware-artifacts.txt
          ls -lh release-artifacts
      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: Padavan
          artifacts: release-artifacts/*.trx
          allowUpdates: true
          replacesArtifacts: true
